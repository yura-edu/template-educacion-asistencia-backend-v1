name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sin `version:` a propósito: la versión de pnpm se toma del campo
      # "packageManager" del package.json (fuente única de verdad).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
